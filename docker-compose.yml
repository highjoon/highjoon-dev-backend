services:
  postgres:
    image: postgres:16
    container_name: highjoon-dev-postgres
    environment:
      POSTGRES_DB: highjoon_dev
      POSTGRES_USER: highjoon
      POSTGRES_PASSWORD: highjoon
    ports:
      - "5432:5432"
    volumes:
      - highjoon-dev-pgdata:/var/lib/postgresql/data

volumes:
  highjoon-dev-pgdata:
