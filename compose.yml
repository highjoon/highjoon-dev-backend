name: highjoon-dev-app

x-app: &app-base
  restart: unless-stopped
  env_file:
    - .env
  mem_limit: 1g
  cpus: 1.0
  stop_grace_period: 40s
  labels:
    stack: highjoon-dev
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      labels: "stack"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 180s
    start_interval: 5s
  networks:
    - highjoon-dev-net

services:
  app-blue:
    <<: *app-base
    profiles: [ "blue" ]
    image: ghcr.io/highjoon/highjoon-dev-backend:${BLUE_TAG:-latest}
    ports:
      - "127.0.0.1:8081:8080"

  app-green:
    <<: *app-base
    profiles: [ "green" ]
    image: ghcr.io/highjoon/highjoon-dev-backend:${GREEN_TAG:-latest}
    ports:
      - "127.0.0.1:8082:8080"

  fluent-bit:
    image: fluent/fluent-bit:3.2
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    networks:
      - highjoon-dev-net
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /opt/highjoon-dev/fluent-bit:/fluent-bit/etc:ro
      - flb-state:/var/log/flb
    logging:
      driver: "none"

networks:
  highjoon-dev-net:
    external: true

volumes:
  flb-state:
