spring:
  application:
    name: highjoon-dev-backend
  config:
    import: optional:file:application-local.yml
  # 종료 시 진행 중인 요청을 기다리는 최대 시간
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000

server:
  forward-headers-strategy: native
  # graceful shutdown: 종료 신호를 받아도 처리 중인 요청을 끝내고 내려감
  shutdown: graceful

app:
  cors:
    allowed-origins: https://www.highjoon-dev.com,https://highjoon-dev.com,http://localhost:3000
  write-api:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false
