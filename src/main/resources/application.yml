spring:
  application:
    name: highjoon-dev-backend
  config:
    import: optional:file:application-local.yml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000

server:
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: https://www.highjoon-dev.com,https://highjoon-dev.com,http://localhost:3000
  write-api:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false
