name: deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/highjoon/highjoon-dev-backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Prepare SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_HOST_KEY: ${{ secrets.VM_SSH_HOST_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$VM_SSH_HOST_KEY" ]; then
            echo "$VM_SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deploy files
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh "$VM_USER@$VM_HOST" bash -s <<'EOF'
            cd /opt/highjoon-dev
            cp compose.yml compose.yml.prev 2>/dev/null || true
            rm -rf fluent-bit.prev
            cp -r fluent-bit fluent-bit.prev 2>/dev/null || true
            mkdir -p fluent-bit
          EOF
          scp compose.yml "$VM_USER@$VM_HOST:/opt/highjoon-dev/compose.yml"
          scp deploy/fluent-bit/*.conf "$VM_USER@$VM_HOST:/opt/highjoon-dev/fluent-bit/"

      - name: Deploy
        id: deploy
        timeout-minutes: 10
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$VM_USER@$VM_HOST" \
            env IMAGE_TAG="$IMAGE_TAG" IMAGE_NAME="$IMAGE_NAME" bash -s <<'EOF'
            set -e
            cd /opt/highjoon-dev
            if [ -f .env.deploy ]; then
              cp .env.deploy .env.deploy.prev
            fi

            echo "IMAGE_TAG=$IMAGE_TAG" > .env.deploy
            docker compose --env-file .env.deploy pull
            docker compose --env-file .env.deploy up -d --wait --wait-timeout 300

            KEEP_PREV=$(sed -n 's/^IMAGE_TAG=//p' .env.deploy.prev 2>/dev/null || true)
            docker images "$IMAGE_NAME" --format '{{.Tag}}' | while read -r tag; do
              case "$tag" in
                "$IMAGE_TAG"|"$KEEP_PREV"|latest|'<none>') continue ;;
              esac
              docker rmi "$IMAGE_NAME:$tag" >/dev/null 2>&1 || true
            done
            docker image prune -f
          EOF

      - name: Health check
        id: healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 https://api.highjoon-dev.com/actuator/health | grep -q '"UP"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Rollback
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh "$VM_USER@$VM_HOST" bash -s <<'EOF'
            set -e
            cd /opt/highjoon-dev

            if [ ! -f .env.deploy.prev ]; then
              exit 1
            fi

            if [ -f compose.yml.prev ]; then
              cp compose.yml.prev compose.yml
            fi

            if [ -d fluent-bit.prev ]; then
              rm -rf fluent-bit
              cp -r fluent-bit.prev fluent-bit
            fi

            cp .env.deploy.prev .env.deploy
            docker compose --env-file .env.deploy pull
            docker compose --env-file .env.deploy up -d --wait --wait-timeout 300
          EOF

          for i in $(seq 1 18); do
            if curl -fsS --max-time 5 https://api.highjoon-dev.com/actuator/health | grep -q '"UP"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
