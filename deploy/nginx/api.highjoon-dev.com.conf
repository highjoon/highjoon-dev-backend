# 참고용 스냅샷. 배포가 이 파일을 VM에 올리지 않음
# certbot이 직접 관리하는 파일이라 배포가 덮어쓰면 인증서 갱신이 깨짐
# VM 경로: /etc/nginx/sites-available/api.highjoon-dev.com.conf
server {
    # 이 도메인으로 온 요청만 처리
    server_name api.highjoon-dev.com;

    # 모든 경로에 적용
    location / {
        # 활성 색으로 전달. 실제 포트는 conf.d/backend-upstream.conf 가 지정
        proxy_pass http://backend;

        # 원본 요청 정보를 백엔드에 전달
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # 백엔드 응답 없을 시 대기 한도
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.highjoon-dev.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.highjoon-dev.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.highjoon-dev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.highjoon-dev.com;
    return 404; # managed by Certbot
}
