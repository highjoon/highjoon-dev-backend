global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: highjoon-dev-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app-blue:8080
          - app-green:8080

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
